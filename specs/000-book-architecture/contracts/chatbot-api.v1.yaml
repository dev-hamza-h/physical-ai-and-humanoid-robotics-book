openapi: 3.0.0
info:
  title: Chatbot API
  version: 1.0.0
  description: API for the RAG chatbot that answers questions about the book content.
servers:
  - url: /api/v1
paths:
  /query:
    post:
      summary: Query the chatbot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: The user's query.
      responses:
        '200':
          description: The chatbot's response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: The chatbot's answer.
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                          description: The source of the information (e.g., a chapter or section title).
                        content:
                          type: string
                          description: The relevant content from the source.